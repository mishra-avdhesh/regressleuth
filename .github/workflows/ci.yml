name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e ".[demo,dev]"
      - name: Lint, format and strict types
        run: |
          ruff check .
          ruff format --check .
          mypy --strict
      - name: Frozen method and sealed suites
        run: |
          python benchmarks/freeze_method.py verify
          python benchmarks/seal.py verify benchmarks/holdout --definitions-only
          python benchmarks/seal.py verify benchmarks/higher_order --definitions-only
          python benchmarks/historical/verify_snapshot.py
          python benchmarks/drift/harness.py verify
      - name: Prepare the HTTP service demo (used by an integration test)
        run: python examples/http_service/prepare.py
      - name: Tests with coverage
        run: pytest --cov=regressleuth --cov-report=term-missing --cov-fail-under=90
      - name: Bundled demo
        run: regressleuth demo
      - name: Build and check distributions
        run: |
          python -m build
          twine check dist/*
          python tools/audit_package.py dist/*
      - name: Install the wheel in a clean environment
        run: |
          python -m venv "$RUNNER_TEMP/clean"
          "$RUNNER_TEMP/clean/bin/pip" install dist/*.whl
          cd "$RUNNER_TEMP" && "$RUNNER_TEMP/clean/bin/regressleuth" demo

  real-model-fixtures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[demo]"
      - name: Prove development ground truth (offline incidents)
        env:
          OMP_NUM_THREADS: "1"
        run: |
          python examples/real_tabular/prepare.py
          python examples/real_image/prepare.py
          python examples/real_noisy/prepare.py
          python benchmarks/validate_fixtures.py churn_ tabular_ image_ noisy_
      - name: Recompute the evaluation from stored replay tables
        run: python benchmarks/evaluate.py development
