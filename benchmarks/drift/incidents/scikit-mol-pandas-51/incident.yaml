version: '1.0'
id: scikit-mol-pandas-51
description: "Some tests fails with some version of pandas"
good:
  pandas: "2.2.2"
  platformdirs: "4.3.3"
  tzdata: "2024.1"
bad:
  pandas: "2.2.3"
  platformdirs: "4.3.6"
  tzdata: "2024.2"
metric: {name: drift_tests_pass, direction: higher_is_better, regression_threshold: 0.5}
