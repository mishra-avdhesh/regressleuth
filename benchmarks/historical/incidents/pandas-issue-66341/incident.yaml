version: '1.0'
id: pandas-issue-66341
description: str.split on a categorical returns string-formatted lists in pandas 3.0.
good:
  pandas: 2.3.1
bad:
  pandas: 3.0.0
metric:
  name: historical_str_split_test_pass
  direction: higher_is_better
  regression_threshold: 0.5
replay:
  repeats: 1
  max_repeats: 1
  confidence: 0.95
  interval: student_t
search:
  strategy: adaptive
  max_cause_size: 2
  seed: 0
budget:
  max_replays: 16
  audit: extended
cases: cases.json
adapter:
  type: command
  command:
  - '{python}'
  - runner.py
  - --state
  - '{state}'
  - --result
  - '{result}'
  timeout_seconds: 300
  interpreters:
    component: pandas
    map:
      2.3.1: ../../envs/pandas-2.3.1/bin/python
      3.0.0: ../../envs/pandas-3.0.0/bin/python
