version: '1.0'
id: sklearn-linear-float32-33032
description: LinearRegression on large float32 input returns a far worse least-squares fit after 1.6.0.
good:
  scikit-learn: 1.5.2
bad:
  scikit-learn: 1.6.0
metric:
  name: historical_float32_lstsq_test_pass
  direction: higher_is_better
  regression_threshold: 0.5
replay:
  repeats: 1
  max_repeats: 1
  confidence: 0.95
  interval: student_t
search:
  strategy: adaptive
  max_cause_size: 2
  seed: 0
budget:
  max_replays: 16
  audit: extended
cases: cases.json
adapter:
  type: command
  command:
  - '{python}'
  - runner.py
  - --state
  - '{state}'
  - --result
  - '{result}'
  timeout_seconds: 300
  interpreters:
    component: scikit-learn
    map:
      1.5.2: ../../envs/sklearn-1.5.2/bin/python
      1.6.0: ../../envs/sklearn-1.6.0/bin/python
