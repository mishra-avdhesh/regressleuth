version: '1.0'
id: pandas-attrs-deepcopy-57859
description: Pandas 2.2 deep-copies attrs, breaking a custom mapping stored there.
good:
  pandas: 2.1.4
bad:
  pandas: 2.2.1
metric:
  name: historical_attrs_test_pass
  direction: higher_is_better
  regression_threshold: 0.5
replay:
  repeats: 1
  max_repeats: 1
  confidence: 0.95
  interval: student_t
search:
  strategy: adaptive
  max_cause_size: 2
  seed: 0
budget:
  max_replays: 16
  audit: extended
cases: cases.json
adapter:
  type: command
  command:
  - '{python}'
  - runner.py
  - --state
  - '{state}'
  - --result
  - '{result}'
  timeout_seconds: 300
  interpreters:
    component: pandas
    map:
      2.1.4: ../../envs/pandas-2.1.4/bin/python
      2.2.1: ../../envs/pandas-2.2.1/bin/python
