version: '1.0'
id: holdout_ctrl_pillow_subthreshold
description: 'The documented Pillow 7.0 default-filter change, served to a model trained on NEAREST-resized
  MNIST digits, costs only about 1.3 accuracy points: below the 3-point threshold, so the correct result
  is that the endpoints do not separate.'
metadata:
  provenance:
  - title: 'Pillow 7.0.0 release notes: default resampling filter'
    url: https://pillow.readthedocs.io/en/stable/releasenotes/7.0.0.html
  - title: 'python-pillow/Pillow#4255: change default resize filter to BICUBIC'
    url: https://github.com/python-pillow/Pillow/pull/4255
  reconstruction: MNIST (real data); Pillow 10's default BICUBIC resize is real, the legacy NEAREST default
    is reproduced by the explicit call
  dataset: MNIST via ylecun/mnist
  benchmark: holdout-control
  preregistered: benchmarks/holdout/PREREGISTRATION.md
good:
  resize_call: explicit-nearest
  model: m1
  log_level: info
  cache_ttl: '300'
  worker_count: '1'
bad:
  resize_call: library-default
  model: m1b
  log_level: debug
  cache_ttl: '600'
  worker_count: '4'
metric:
  name: accuracy
  direction: higher_is_better
  regression_threshold: 0.03
budget:
  max_replays: 16
  audit: full
cases: ../data/mnist/cases.json
adapter:
  type: command
  command:
  - '{python}'
  - ../runners/mnist_resize.py
  - --state
  - '{state}'
  - --result
  - '{result}'
  timeout_seconds: 300
